<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Gran Johan | En Vivo</title>
    <style>
        /* Configuración base de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* Fondo negro puro */
            color: #ffffff;
            margin: 0;
            padding: 20px 10px; 
            display: flex;
            flex-direction: column; /* Alinea la tarjeta y el bloque de anuncios uno abajo del otro */
            justify-content: flex-start; 
            align-items: center; /* Centra horizontalmente ambos bloques */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Contenedor central principal */
        .tarjeta-radio {
            background-color: #000000; 
            width: 100%;
            max-width: 400px; 
            margin-top: 15px; 
            padding: 20px;
            border-radius: 15px; 
            box-shadow: 0px 0px 20px rgba(246, 250, 1, 0.993); 
            text-align: center;
            border: 1px solid #d4af37; /* Borde dorado */
            box-sizing: border-box;
        }

        /* Contenedor de la Imagen / Logo */
        .imagen-emisora-container {
            width: 100%;
            max-width: 340px; 
            margin: 0 auto 15px auto; 
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .imagen-emisora-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Estilos del botón llamativo de la app */
        .contenedor-app {
            margin: 25px 0 15px 0; 
            display: flex;
            justify-content: center;
        }

        .boton-descarga {
            display: inline-flex;
            align-items: center;
            background-color: #111115;
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 12px;
            border: 2px solid #e81e4d; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0px 0px 15px rgba(232, 30, 77, 0.4);
            animation: pulsoBrillante 2s infinite;
        }

        .boton-descarga:hover {
            background-color: #e81e4d;
            transform: scale(1.05);
            box-shadow: 0px 0px 25px rgba(232, 30, 77, 0.8);
        }

        .boton-descarga .icono-play {
            font-size: 24px;
            margin-right: 12px;
        }

        .boton-descarga .texto-boton {
            text-align: left;
        }

        .boton-descarga .texto-pequeno {
            font-size: 10px;
            display: block;
            color: #a0a0b0;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .boton-descarga .texto-grande {
            font-size: 16px;
            display: block;
        }

        @keyframes pulsoBrillante {
            0% { box-shadow: 0px 0px 10px rgba(232, 30, 77, 0.4); }
            50% { box-shadow: 0px 0px 25px rgba(232, 30, 77, 0.8); border-color: #ff4a75; }
            100% { box-shadow: 0px 0px 10px rgba(232, 30, 77, 0.4); }
        }

        /* Contenedor para el texto de abajo */
        .texto-inferior {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }

        .texto-inferior p {
            font-size: 15px;
            color: #a0a0b0;
            margin: 5px 0;
        }

        /* 🚀 CONTENEDOR PUBLICITARIO (FUERA DE LA TARJETA) */
        .contenedor-publicidad {
            width: 100%;
            max-width: 400px; /* Mismo ancho de la tarjeta para mantener simetría */
            margin-top: 15px; /* Espacio prudente abajo de la tarjeta principal */
            padding: 15px;
            background-color: #0b0b0e;
            border: 1px dashed #3a3a4a; /* Línea discontinua discreta */
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }

        .contenedor-publicidad-arriba {
            width: 100%;
            max-width: 400px; /* Mismo ancho de la tarjeta para mantener simetría */
            margin-top:1px; /* Espacio prudente abajo de la tarjeta principal */
            padding: 5px;
            background-color: #0b0b0e;
            border: 1px dashed #3a3a4a; /* Línea discontinua discreta */
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }

        .publicidad-titulo {
            font-size: 11px;
            color: #555565;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .publicidad-espacio {
            min-height: 255px; /* Altura estándar para banners móviles (320x50 o 300x250) */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border-radius: 8px;
            color: #000000;
            font-size: 13px;
        }

        .ads-superior-box{
            min-height: 70px; /* Altura estándar para banners móviles (320x50 o 300x250) */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border-radius: 8px;
            color: #000000;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="contenedor-publicidad-arriba">
        <p class="publicidad-titulo">Publicidad</p>
        <div class="ads-superior-box" id="banner-arriba">
                <!-- El código de Adsterra se inyectará aquí de forma automática -->
        </div>
    </div>

    <!-- CONTENEDOR CENTRAL (TARJETA DE RADIO) -->
    <div class="tarjeta-radio">

        <!-- CONTENEDOR DE LA IMAGEN (EL GRAN JOHAN) -->
        <div class="imagen-emisora-container">
            <img src="logo1.jpeg" alt="El Gran Johan">
        </div>

        <div id="reproductor-stream" style="max-width: 480px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; border-radius: 12px; padding: 20px; color: #fff;">
  
          <div style="text-align: center; margin-bottom: 16px;">
            <div id="ahora-suena" style="font-size: 14px; color: #aaa; margin-bottom: 4px;">Cargando...</div>
            <div id="titulo-cancion" style="font-size: 18px; font-weight: 600; min-height: 24px;">—</div>
          </div>
         
          <audio id="audioPlayer" controls preload="none" style="width: 100%;">
            <source src="http://78.129.237.51:22529/;stream.mp3" type="audio/mpeg">
            Tu navegador no soporta la reproducción de audio HTML5.
          </audio>
         
          <div id="estado-metadata" style="font-size: 11px; color: #666; text-align: center; margin-top: 8px;"></div>
        </div>
        
        <!-- BOTÓN LLAMATIVO PARA DESCARGAR LA APP -->
        <div class="contenedor-app">
            <a href="#" class="boton-descarga" target="_blank">
                <span class="icono-play">🤖</span>
                <span class="texto-boton">
                    <span class="texto-pequeno">Disponible para Android</span>
                    <span class="texto-pequeno">100% segura</span>
                    <span class="texto-grande">Descargar App</span>
                </span>
            </a>
        </div>

        <!-- TEXTO DEBAJO DEL REPRODUCTOR -->
        <div class="texto-inferior">
            <p>🎙 *¡Gracias por sintonizar El Gran Johan!*</p>
            <p>¡Desarrollado por <b>Msoftware</b>! </p>
        </div>

    </div> <!-- FIN DE LA TARJETA DE RADIO -->


    <!-- 🚀 2. RECUADRO AUTO-REFRESCANTE PARA EL BANNER INFERIOR (300x250) -->
    <div class="contenedor-publicidad">
        <p class="publicidad-titulo">Publicidad</p>
        <div class="publicidad-espacio" id="banner-abajo">
            <!-- El código de Adsterra se inyectará aquí de forma automática -->
        </div>
    </div>

    <!-- 🛠️ SISTEMA DE ROTACIÓN/REFRESCO AUTOMÁTICO CADA 60 SEGUNDOS -->



<script>
    // ==========================================
    // CARGAR BANNER SUPERIOR
    // ==========================================
    function cargarBannerArriba() {
        const contenedor = document.getElementById("banner-arriba");
        if (!contenedor) return;

        contenedor.innerHTML = "";

        window.atOptions = {
            'key': 'ab324a06e328fdef5c9f83e517f1877a',
            'format': 'iframe',
            'height': 50,
            'width': 320,
            'params': {}
        };

        const script = document.createElement("script");
        script.type = "text/javascript";
        script.src = "https://www.highrevenueformat.com/ab324a06e328fdef5c9f83e517f1877a/invoke.js";
        contenedor.appendChild(script);
    }

    // ==========================================
    // CARGAR BANNER INFERIOR
    // ==========================================
    function cargarBannerAbajo() {
        const contenedor = document.getElementById("banner-abajo");
        if (!contenedor) return;

        contenedor.innerHTML = "";

        window.atOptions = {
            'key': 'e8213ad612ae47b8693959bc4709ab6e',
            'format': 'iframe',
            'height': 250,
            'width': 300,
            'params': {}
        };

        const script = document.createElement("script");
        script.type = "text/javascript";
        script.src = "https://www.highrevenueformat.com/e8213ad612ae47b8693959bc4709ab6e/invoke.js";
        contenedor.appendChild(script);
    }

    // ==========================================
    // CARGA INICIAL (con separación real entre uno y otro)
    // ==========================================
    window.addEventListener("DOMContentLoaded", function () {
        cargarBannerArriba();

        setTimeout(function () {
            cargarBannerAbajo();
        }, 6000); // separación amplia para que "arriba" termine antes de que arranque "abajo"
    });

    // ==========================================
    // REFRESCO CADA 30 SEGUNDOS, DESFASADOS ENTRE SÍ
    // ==========================================
    setInterval(cargarBannerArriba, 30000);

    // Arranca su propio ciclo de 30s, pero desplazado 15s respecto al de arriba
    setTimeout(function () {
        setInterval(cargarBannerAbajo, 30000);
    }, 15000);


    (function () {
  // ============================================
  // CONFIGURA AQUÍ
  // ============================================
  const STREAM_URL = "http://78.129.237.51:22529/;stream.mp3"; // tu URL directa del stream
 
  // Confirmado: tu servidor es Shoutcast v1, que expone metadatos como texto
  // plano en /7.html (no JSON). Formato: oyentes,estado,pico,max,unicos,bitrate,titulo
  const METADATA_TXT_URL = "http://78.129.237.51:22529/7.html";
 
  // Cada cuánto revisar metadatos (en milisegundos)
  const INTERVALO_ACTUALIZACION = 10000; // 10 segundos
  // ============================================
 
  const audio = document.getElementById("audioPlayer");
  const source = audio.querySelector("source");
  const tituloEl = document.getElementById("titulo-cancion");
  const ahoraSuenaEl = document.getElementById("ahora-suena");
  const estadoEl = document.getElementById("estado-metadata");
 
  source.src = STREAM_URL;
  audio.load();
 
  // MÉTODO A: formato texto de Shoutcast v1 (/7.html)
  // Respuesta ejemplo: 0,1,4,10000,0,128,Es Mi Mujer
  async function actualizarViaTexto() {
    try {
      const res = await fetch(METADATA_TXT_URL, { cache: "no-store" });
      const texto = (await res.text()).trim();
 
      // Los primeros 6 campos son numéricos; todo lo que viene después
      // del 6to coma es el título (puede contener comas también).
      const partes = texto.split(",");
      const titulo = partes.slice(6).join(",").trim();
 
      if (titulo) {
        tituloEl.textContent = titulo;
        ahoraSuenaEl.textContent = "🎵 Sonando ahora";
        estadoEl.textContent = "";
      } else {
        estadoEl.textContent = "No se pudo extraer el título de la respuesta.";
        console.log("Respuesta cruda del servidor:", texto);
      }
    } catch (err) {
      estadoEl.textContent = "No se pudo leer /7.html (revisa CORS o que la URL responda).";
      console.error("Error obteniendo metadatos de texto:", err);
    }
  }
 
  // MÉTODO B: metadatos ICY embebidos en el propio stream (respaldo)
  // Nota: requiere que el servidor permita CORS y exponga la cabecera Icy-MetaData.
  // No funciona en todos los navegadores ni todos los servidores.
  async function actualizarViaICY() {
    try {
      const res = await fetch(STREAM_URL, {
        headers: { "Icy-MetaData": "1" },
      });
      const metaInt = parseInt(res.headers.get("icy-metaint"));
      if (!metaInt) {
        estadoEl.textContent = "El servidor no expone icy-metaint (metadatos no disponibles vía este método).";
        return;
      }
 
      const reader = res.body.getReader();
      let bytesLeidos = 0;
      let buffer = new Uint8Array(0);
 
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
 
        buffer = concatBuffers(buffer, value);
 
        if (bytesLeidos + value.length >= metaInt) {
          const offset = metaInt - bytesLeidos;
          const metaLength = buffer[offset] * 16;
          if (metaLength > 0) {
            const metaBytes = buffer.slice(offset + 1, offset + 1 + metaLength);
            const metaStr = new TextDecoder("utf-8").decode(metaBytes);
            const match = metaStr.match(/StreamTitle='([^']*)'/);
            if (match && match[1]) {
              tituloEl.textContent = match[1];
              ahoraSuenaEl.textContent = "🎵 Sonando ahora";
            }
          }
          reader.cancel(); // ya obtuvimos un bloque, cortamos la conexión de lectura
          break;
        }
      }
    } catch (err) {
      estadoEl.textContent = "El método ICY directo falló (normalmente por CORS). Usa el endpoint JSON si tu proveedor lo ofrece.";
      console.error("Error leyendo metadatos ICY:", err);
    }
  }
 
  function concatBuffers(a, b) {
    const c = new Uint8Array(a.length + b.length);
    c.set(a, 0);
    c.set(b, a.length);
    return c;
  }
 
  function actualizarMetadatos() {
    actualizarViaTexto();
  }
 
  audio.addEventListener("play", () => {
    actualizarMetadatos();
    setInterval(actualizarMetadatos, INTERVALO_ACTUALIZACION);
  });
})();
</script>
